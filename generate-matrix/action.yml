name: Generate Matrix
description: Sub-action to generate a matrix of stack-yamls
inputs:
  working-directory:
    description: "Working directory for run commands"
    required: true
    default: .
  find-options:
    description: "Arguments to find(1) stack-yaml files"
    required: true
    default: "-type f -maxdepth 1 -name 'stack*.yaml'"
outputs:
  stack-yamls:
    description: Version-sorted list of all files matching stack*.yaml
    value: ${{ steps.generate.outputs.stack-yamls }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: generate
      name: Generate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FIND_OPTIONS: ${{ inputs.find-options }}
      run: |
        find_opts=()
        if [ -n "$FIND_OPTIONS" ]; then
          while IFS= read -r -d '' t; do find_opts+=("$t"); done \
            < <(printf '%s' "$FIND_OPTIONS" | xargs printf '%s\0')
        fi
        result=$(find "${find_opts[@]}" -printf '"%f"\n' | sort -V | jq --slurp)
        safe=$(printf '%s' "$result" | tr -d '\n\r')
        echo "stack-yamls=$safe" >>"$GITHUB_OUTPUT"
