name: Test custom find-options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/stacks
          find-options: "-type f -maxdepth 1 -name 'stack-2.yaml'"
      - name: Assert only stack-2.yaml is returned
        env:
          ACTUAL: ${{ steps.action.outputs.stack-yamls }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: stack-yamls output is empty"
            exit 1
          fi
          # Must be valid JSON array
          echo "$ACTUAL" | jq -e 'type == "array"' > /dev/null || {
            echo "FAIL: output is not a JSON array"
            exit 1
          }
          # Should contain exactly one element: stack-2.yaml
          LENGTH=$(echo "$ACTUAL" | jq 'length')
          echo "array length: $LENGTH"
          if [ "$LENGTH" != "1" ]; then
            echo "FAIL: expected exactly 1 file, got $LENGTH"
            exit 1
          fi
          FIRST=$(echo "$ACTUAL" | jq -r '.[0]')
          echo "first element: $FIRST"
          if [ "$FIRST" != "stack-2.yaml" ]; then
            echo "FAIL: expected 'stack-2.yaml', got '$FIRST'"
            exit 1
          fi
          echo "PASS: custom find-options correctly filtered to stack-2.yaml only"
