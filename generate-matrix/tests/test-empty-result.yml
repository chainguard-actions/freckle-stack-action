name: Test empty result - no matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty working directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/empty-stacks"

      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/fixtures/empty-stacks

      - name: Assert output is an empty JSON array
        env:
          ACTUAL: ${{ steps.action.outputs.stack-yamls }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: stack-yamls output is empty (expected '[]')"
            exit 1
          fi
          # Validate it is valid JSON
          echo "$ACTUAL" | jq . > /dev/null 2>&1 || { echo "FAIL: output is not valid JSON"; exit 1; }
          COUNT=$(echo "$ACTUAL" | jq 'length')
          echo "count: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "FAIL: expected empty array (length 0), got $COUNT entries"
            exit 1
          fi
          echo "PASS: empty directory returns empty JSON array"
