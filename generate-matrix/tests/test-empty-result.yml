name: Test empty result when no files match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/stacks
          find-options: "-type f -maxdepth 1 -name 'nonexistent-*.yaml'"
      - name: Assert output is an empty JSON array
        env:
          ACTUAL: ${{ steps.action.outputs.stack-yamls }}
        run: |
          echo "actual: $ACTUAL"
          # Must be valid JSON
          echo "$ACTUAL" | jq -e 'type == "array"' > /dev/null || {
            echo "FAIL: output is not a JSON array"
            exit 1
          }
          # Must be empty
          LENGTH=$(echo "$ACTUAL" | jq 'length')
          echo "array length: $LENGTH"
          if [ "$LENGTH" != "0" ]; then
            echo "FAIL: expected empty array (length 0), got length $LENGTH"
            exit 1
          fi
          echo "PASS: empty result correctly returns empty JSON array"
