name: Test empty result - no matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with no stack yaml files
        run: |
          mkdir -p /tmp/test-empty
          touch /tmp/test-empty/config.yaml
          touch /tmp/test-empty/README.md

      - id: action
        uses: .
        with:
          working-directory: /tmp/test-empty

      - name: Assert output is an empty JSON array
        env:
          ACTUAL: ${{ steps.action.outputs.stack-yamls }}
        run: |
          echo "actual: $ACTUAL"
          # Should be valid JSON
          echo "$ACTUAL" | jq . > /dev/null || { echo "FAIL: output is not valid JSON"; exit 1; }
          COUNT=$(echo "$ACTUAL" | jq 'length')
          echo "count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected 0 files, got $COUNT"
            exit 1
          fi
          echo "PASS: empty array returned as expected"
