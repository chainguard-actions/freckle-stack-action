name: Test version-sorted output with multiple stack yaml files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/multi-stacks

      - name: Assert stack-yamls output contains all three files
        env:
          ACTUAL: ${{ steps.action.outputs.stack-yamls }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: stack-yamls output is empty"
            exit 1
          fi
          # Verify it is valid JSON array
          echo "$ACTUAL" | jq -e 'type == "array"' > /dev/null || {
            echo "FAIL: output is not a JSON array"
            exit 1
          }
          COUNT=$(echo "$ACTUAL" | jq 'length')
          echo "count: $COUNT"
          if [ "$COUNT" -ne 3 ]; then
            echo "FAIL: expected 3 stack yamls, got $COUNT"
            exit 1
          fi
          echo "PASS: found $COUNT stack yaml(s)"

      - name: Assert version sort order is correct (1.0.0 < 2.0.0 < 10.0.0)
        env:
          ACTUAL: ${{ steps.action.outputs.stack-yamls }}
        run: |
          echo "actual: $ACTUAL"
          FIRST=$(echo "$ACTUAL" | jq -r '.[0]')
          SECOND=$(echo "$ACTUAL" | jq -r '.[1]')
          THIRD=$(echo "$ACTUAL" | jq -r '.[2]')
          echo "first: $FIRST"
          echo "second: $SECOND"
          echo "third: $THIRD"
          if [ "$FIRST" != "stack-1.0.0.yaml" ]; then
            echo "FAIL: expected first to be 'stack-1.0.0.yaml', got '$FIRST'"
            exit 1
          fi
          if [ "$SECOND" != "stack-2.0.0.yaml" ]; then
            echo "FAIL: expected second to be 'stack-2.0.0.yaml', got '$SECOND'"
            exit 1
          fi
          if [ "$THIRD" != "stack-10.0.0.yaml" ]; then
            echo "FAIL: expected third to be 'stack-10.0.0.yaml', got '$THIRD'"
            exit 1
          fi
          echo "PASS: version sort order is correct"
