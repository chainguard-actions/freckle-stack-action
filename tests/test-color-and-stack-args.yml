name: Test color and stack-arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          color: false
          stack-build-arguments: "--fast"
          cache-prefix: "v1"

      - name: Assert action ran with color disabled and cache-prefix set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with color disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without full Haskell toolchain)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
