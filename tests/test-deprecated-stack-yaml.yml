name: Test deprecated stack-yaml input emits warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: example
          stack-yaml: stack.yaml
          test: false
          upgrade-stack: false
          stack-build-arguments: "--fast"
          cache-prefix: "test-deprecated-v1"

      - name: Assert compiler output is set (action succeeded despite deprecated input)
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
        run: |
          echo "compiler: $COMPILER"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set even with deprecated stack-yaml input"
            exit 1
          fi
          if ! echo "$COMPILER" | grep -qE '^ghc-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: compiler output '$COMPILER' does not match expected pattern ghc-X.Y.Z"
            exit 1
          fi
          echo "PASS: action succeeded with deprecated stack-yaml input, compiler=$COMPILER"
