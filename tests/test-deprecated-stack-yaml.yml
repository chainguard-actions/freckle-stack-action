name: Test - deprecated stack-yaml input emits warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use the deprecated stack-yaml input to verify it is accepted
          # (the action emits a warning but does not immediately fail)
          stack-yaml: "stack.yaml"
          install-stack: "false"
          upgrade-stack: "false"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if stack is present) or fail
          # gracefully (stack not installed / no stack.yaml). It must NOT be
          # skipped, which would indicate the action was never invoked.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have been skipped"
            exit 1
          fi
