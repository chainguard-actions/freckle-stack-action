name: Test build phase arguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: hardened/tests/fixtures/haskell-project
          stack-build-arguments-dependencies: "--no-terminal"
          stack-build-arguments-test: "--no-terminal"
          test: true
          install-stack: true
          upgrade-stack: false
      - name: Assert action ran (build phase arguments accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with build phase arguments (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
