name: Test compiler-tools installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          upgrade-stack: false
          stack-build-arguments: "--fast"
          compiler-tools: |
            hspec-discover

      - name: Assert compiler output set and tool installed
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
        working-directory: tests/fixtures/haskell-project
        run: |
          echo "compiler: $COMPILER"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set"
            exit 1
          fi
          TOOLS_BIN="$(stack path --compiler-tools-bin 2>/dev/null || true)"
          echo "compiler-tools-bin: $TOOLS_BIN"
          if [ -n "$TOOLS_BIN" ] && [ ! -x "$TOOLS_BIN/hspec-discover" ]; then
            echo "FAIL: hspec-discover not found in $TOOLS_BIN"
            ls -la "$TOOLS_BIN" || true
            exit 1
          fi
          echo "PASS"
