name: Test compiler-tools input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          compiler-tools: |
            hlint
            hpack
          install-stack: true
          upgrade-stack: false
          test: false
      - name: Assert action ran with compiler-tools input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) with compiler-tools input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
