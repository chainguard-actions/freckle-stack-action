name: Test additional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          stack-yaml: "stack.yaml"
          stack-query-arguments: "--no-terminal"
          stack-path-arguments: "--bin-path"
          stack-setup-arguments: "--no-terminal"
          stack-build-arguments-dependencies: "--no-terminal"
          stack-build-arguments-build: "--no-terminal"
          stack-build-arguments-test: "--no-terminal"
          compiler-tools: |
            hlint
      - name: Assert action ran (inputs accepted, may fail without a real Haskell project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with additional inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Haskell project present, but inputs were accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
