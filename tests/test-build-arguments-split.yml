name: Test split stack build arguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-stack: "true"
          upgrade-stack: "false"
          test: "true"
          color: "false"
          stack-arguments: "--no-terminal"
          stack-build-arguments: "--fast"
          stack-build-arguments-dependencies: "--no-run-tests"
          stack-build-arguments-build: "--no-run-tests"
          stack-build-arguments-test: "--no-run-benchmarks"
          working-directory: tests/fixtures/haskell-project
        continue-on-error: true
      - name: Assert action ran with split build arguments
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with split build arguments"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without full Haskell toolchain in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
