name: Test stack build with tests skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: action/example
          test: false
          install-stack: true
          upgrade-stack: false
          stack-build-arguments: "--fast"
          on-dirty-files: warn

      - name: Assert compiler output is set when tests are skipped (or action failed gracefully)
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMPILER" ]; then
              echo "FAIL: action succeeded but compiler output is empty"
              exit 1
            fi
            if [ -z "$COMPILER_VERSION" ]; then
              echo "FAIL: action succeeded but compiler-version output is empty"
              exit 1
            fi
            # compiler-version should be a version number like 9.x.x
            case "$COMPILER_VERSION" in
              [0-9]*)
                echo "PASS: compiler-version looks like a version number: $COMPILER_VERSION"
                ;;
              *)
                echo "FAIL: expected compiler-version to start with a digit, got: $COMPILER_VERSION"
                exit 1
                ;;
            esac
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (likely due to Haskell build environment constraints in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
