name: Test with install-stack disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-stack: "false"
          upgrade-stack: "false"
          test: "false"
          color: "false"
          stack-arguments: "--no-terminal"
          stack-build-arguments: "--fast"
          working-directory: tests/fixtures/haskell-project
        continue-on-error: true
      - name: Assert action ran with install-stack=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (stack was already available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (stack not pre-installed, no Haskell toolchain in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
