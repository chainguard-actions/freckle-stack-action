name: Test extra inputs coverage (stack-query, stack-path, stack-setup, stack-build per-phase, compiler-tools)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: example
          test: false
          upgrade-stack: false
          stack-arguments: ""
          stack-query-arguments: ""
          stack-path-arguments: ""
          stack-setup-arguments: ""
          stack-build-arguments: "--fast"
          stack-build-arguments-dependencies: ""
          stack-build-arguments-build: ""
          stack-build-arguments-test: ""
          compiler-tools: ""
          cache-prefix: "test-extra-inputs-v1"

      - name: Assert compiler output is set
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
        run: |
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set"
            exit 1
          fi
          if [ -z "$COMPILER_VERSION" ]; then
            echo "FAIL: expected compiler-version output to be set"
            exit 1
          fi
          if ! echo "$COMPILER" | grep -qE '^ghc-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: compiler output '$COMPILER' does not match expected pattern ghc-X.Y.Z"
            exit 1
          fi
          echo "PASS: compiler=$COMPILER compiler-version=$COMPILER_VERSION"
