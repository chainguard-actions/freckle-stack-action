name: Test deprecated stack-yaml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-stack: "true"
          upgrade-stack: "false"
          test: "false"
          color: "false"
          stack-arguments: "--no-terminal"
          stack-build-arguments: "--fast"
          stack-yaml: "stack.yaml"
          working-directory: tests/fixtures/haskell-project
        continue-on-error: true
      - name: Assert action ran with stack-yaml input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with stack-yaml input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without full Haskell toolchain in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
