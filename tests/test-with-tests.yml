name: Test with tests enabled (full build and test)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: example
          test: true
          color: false
          upgrade-stack: false
          stack-build-arguments: "--fast"
          cache-prefix: "test-with-tests-v1"

      - name: Assert compiler and stack-path outputs are set
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
          STACK_ROOT: ${{ steps.action.outputs.stack-root }}
        run: |
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          echo "stack-root: $STACK_ROOT"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set"
            exit 1
          fi
          if [ -z "$COMPILER_VERSION" ]; then
            echo "FAIL: expected compiler-version output to be set"
            exit 1
          fi
          if ! echo "$COMPILER" | grep -qE '^ghc-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: compiler output '$COMPILER' does not match expected pattern ghc-X.Y.Z"
            exit 1
          fi
          if [ -z "$STACK_ROOT" ]; then
            echo "FAIL: expected stack-root output to be set"
            exit 1
          fi
          echo "PASS: compiler=$COMPILER compiler-version=$COMPILER_VERSION stack-root=$STACK_ROOT"
