name: Test error when install-stack is false and stack not present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure stack is not on PATH by using a PATH that excludes it
      - name: Remove stack from PATH if present
        run: |
          # Rename stack binary if it exists so it's not found
          STACK_PATH="$(which stack 2>/dev/null || true)"
          if [ -n "$STACK_PATH" ]; then
            sudo mv "$STACK_PATH" "${STACK_PATH}.bak"
            echo "Moved stack to ${STACK_PATH}.bak"
          else
            echo "stack not found on PATH, good"
          fi

      - id: action
        uses: .
        with:
          working-directory: example
          install-stack: false
          upgrade-stack: false
        continue-on-error: true

      - name: Restore stack if it was moved
        if: always()
        run: |
          STACK_BAK="$(find /usr/local/bin /usr/bin -name 'stack.bak' 2>/dev/null | head -1 || true)"
          if [ -n "$STACK_BAK" ]; then
            sudo mv "$STACK_BAK" "${STACK_BAK%.bak}"
            echo "Restored stack"
          fi

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when stack is not installed and install-stack=false"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: stack was already installed on the runner (install-stack=false still works)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
