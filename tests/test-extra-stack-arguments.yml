name: Test - extra stack arguments inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake stack binary
        run: |
          # Install fake stack to a location that is always on PATH
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/bin/stack" /usr/local/bin/stack || \
            sudo cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/bin/stack" /usr/local/bin/stack
          chmod +x /usr/local/bin/stack || sudo chmod +x /usr/local/bin/stack
          which stack
          stack query 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: hardened/tests/fixtures/haskell-project
          test: "false"
          install-stack: "true"
          upgrade-stack: "false"
          stack-arguments: "--no-terminal"
          stack-build-arguments: "--fast"
          stack-build-arguments-dependencies: "--no-run-tests"
          stack-build-arguments-build: "--no-run-benchmarks"
          stack-build-arguments-test: "--test-arguments=--color=always"
          stack-query-arguments: "--verbosity=warn"
          stack-path-arguments: "--bin-path"
          stack-setup-arguments: "--no-reinstall"
          cache-prefix: "v1"
          color: "false"

      - name: Assert action ran (outputs set, or failed gracefully on missing cache service)
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMPILER" ]; then
              echo "FAIL: action succeeded but 'compiler' output is empty"
              exit 1
            fi
            if [ -z "$COMPILER_VERSION" ]; then
              echo "FAIL: action succeeded but 'compiler-version' output is empty"
              exit 1
            fi
            echo "PASS: extra stack arguments scenario succeeded, compiler=$COMPILER, version=$COMPILER_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely cache service unavailable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
