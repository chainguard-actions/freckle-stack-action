name: Test - compiler tools and stack-yaml inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake stack on PATH
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-stack/stack" /tmp/fake-bin/stack
          chmod +x /tmp/fake-bin/stack
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Verify fake stack is on PATH
        run: |
          which stack
          stack query

      - name: Create stack directories expected by fake stack
        run: |
          mkdir -p /home/runner/.stack/programs/x86_64-linux
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/haskell-project/.stack-work"

      - name: Start mock cache server and configure cache URL
        run: |
          python3 - <<'PYEOF' &
          import http.server, threading, time

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"result":null}')
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  if n > 0:
                      self.rfile.read(n)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"cacheId":1}')
              def do_PATCH(self):
                  n = int(self.headers.get('Content-Length', 0))
                  if n > 0:
                      remaining = n
                      while remaining > 0:
                          chunk = self.rfile.read(min(remaining, 65536))
                          if not chunk:
                              break
                          remaining -= len(chunk)
                  self.send_response(204)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          s = http.server.HTTPServer(('127.0.0.1', 12345), H)
          t = threading.Thread(target=s.serve_forever, daemon=True)
          t.start()
          time.sleep(86400)
          PYEOF
          sleep 2
          echo "ACTIONS_CACHE_URL=http://127.0.0.1:12345/" >> "$GITHUB_ENV"
          echo "ACTIONS_RUNTIME_TOKEN=fake-runtime-token" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/haskell-project
          install-stack: "false"
          upgrade-stack: "false"
          test: "false"
          stack-build-arguments: "--fast"
          compiler-tools: |
            hlint
            weeder
          stack-yaml: "stack.yaml"
          on-dirty-files: warn

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed"
            exit 1
          fi
          echo "PASS: action succeeded"

      - name: Assert compiler output is set
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
        run: |
          echo "compiler: $COMPILER"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set"
            exit 1
          fi
          echo "PASS: compiler output is set"
