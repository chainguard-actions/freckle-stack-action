name: Test invalid on-dirty-files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          upgrade-stack: false
          on-dirty-files: invalid-value

      - name: Assert action failed with invalid on-dirty-files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid on-dirty-files value"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid on-dirty-files value"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
