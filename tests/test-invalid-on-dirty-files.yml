name: Test - error on invalid on-dirty-files value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          on-dirty-files: "invalid-value"
          working-directory: "this-directory-does-not-exist"
          install-stack: "false"
          upgrade-stack: "false"
          test: "false"
          color: "false"
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid on-dirty-files or non-existent working-directory)"
          else
            echo "FAIL: expected action to fail but got outcome='$OUTCOME'"
            exit 1
          fi
