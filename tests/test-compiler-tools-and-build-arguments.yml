name: Test - compiler-tools, stack-build-arguments-dependencies, stack-build-arguments-test inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          install-stack: "false"
          upgrade-stack: "false"
          test: "true"
          stack-build-arguments: "--fast"
          stack-build-arguments-dependencies: "--no-pedantic"
          stack-build-arguments-test: "--no-pedantic"
          compiler-tools: |
            hlint
            weeder

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully.
          # It must NOT be skipped, which would indicate the action was never invoked.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with compiler-tools, stack-build-arguments-dependencies, stack-build-arguments-test (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
