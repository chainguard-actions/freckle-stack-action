name: Test inputs and configuration options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Haskell project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/haskell-proj2/src"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/haskell-proj2/stack.yaml" <<'EOF'
          resolver: lts-22.43
          packages:
            - .
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/haskell-proj2/stack.yaml.lock" <<'EOF'
          # This file was autogenerated by Stack.
          packages: []
          snapshots:
          - completed:
              size: 713200
              url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/22/43.yaml
              sha256: 0d4fedb4e0c6a5e3e3e6e4e5e6e7e8e9e0e1e2e3e4e5e6e7e8e9e0e1e2e3e4e5
            original: lts-22.43
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/haskell-proj2/mylib.cabal" <<'EOF'
          cabal-version: 1.12
          name:           mylib
          version:        0.0.0.0
          build-type:     Simple

          library
            exposed-modules:
                MyLib
            hs-source-dirs:
                src
            build-depends:
                base
            default-language: Haskell2010
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/haskell-proj2/src/MyLib.hs" <<'EOF'
          module MyLib where

          myFunc :: Int -> Int
          myFunc x = x + 1
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/haskell-proj2
          test: false
          color: false
          install-stack: true
          upgrade-stack: false
          cache-prefix: "v1"
          cache-save-always: false
          on-dirty-files: error
          stack-build-arguments: "--fast"

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if stack/GHC available) or fail gracefully
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom inputs (color=false, cache-prefix=v1, on-dirty-files=error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
