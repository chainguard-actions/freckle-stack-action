name: Test with tests disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake stack environment
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-stack/stack"
          echo "$GITHUB_WORKSPACE/tests/fixtures/fake-stack" >> "$GITHUB_PATH"
          mkdir -p /tmp/fake-stack-root/snapshots/x86_64-linux/abc123/9.4.8
          mkdir -p /tmp/fake-stack-root/compiler-tools/x86_64-linux/ghc-9.4.8/bin
          mkdir -p /tmp/fake-stack-programs/ghc-9.4.8/bin
          mkdir -p /tmp/local-bin
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/haskell-project/.stack-work"
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          upgrade-stack: false
          stack-build-arguments: "--fast"
          cache-prefix: "test-no-test-"
      - name: Assert compiler output is set
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
        run: |
          echo "compiler: $COMPILER"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert compiler starts with ghc-
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
        run: |
          echo "compiler: $COMPILER"
          if ! echo "$COMPILER" | grep -qE '^ghc-'; then
            echo "FAIL: expected compiler to start with 'ghc-', got: $COMPILER"
            exit 1
          fi
          echo "PASS: compiler starts with ghc-"
      - name: Assert stack-root output is set
        env:
          STACK_ROOT: ${{ steps.action.outputs.stack-root }}
        run: |
          echo "stack-root: $STACK_ROOT"
          if [ -z "$STACK_ROOT" ]; then
            echo "FAIL: expected stack-root output to be set"
            exit 1
          fi
          echo "PASS: stack-root is set"
