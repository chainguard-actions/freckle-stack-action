name: Test custom cache prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Add mock stack dir to PATH
        run: echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> "$GITHUB_PATH"

      - name: Create mock stack directories for cache operations
        run: |
          mkdir -p /tmp/mock-stack-root
          mkdir -p /tmp/mock-stack-programs
          mkdir -p /tmp/mock-local-bin
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/haskell-project/.stack-work"

      - name: Verify mock stack is available
        run: |
          which stack
          echo "Stack location: $(which stack)"

      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          upgrade-stack: false
          stack-build-arguments: "--fast"
          cache-prefix: "test-v1"
          cache-save-always: true
          on-dirty-files: warn

      - name: Assert compiler output is set with custom cache prefix
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
        run: |
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: compiler output is empty"
            exit 1
          fi
          if [ -z "$COMPILER_VERSION" ]; then
            echo "FAIL: compiler-version output is empty"
            exit 1
          fi
          echo "PASS: build succeeded with custom cache prefix, compiler=$COMPILER"
