name: Test stack build arguments (build/dependencies/test)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          upgrade-stack: false
          install-stack: true
          color: false
          stack-build-arguments: "--fast"
          stack-build-arguments-dependencies: "--no-terminal"
          stack-build-arguments-build: "--no-terminal"
          stack-build-arguments-test: "--no-terminal"
          on-dirty-files: warn
      - name: Assert compiler output is set
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
        run: |
          echo "compiler: $COMPILER"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert compiler-version output is set
        env:
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
        run: |
          echo "compiler-version: $COMPILER_VERSION"
          if [ -z "$COMPILER_VERSION" ]; then
            echo "FAIL: expected compiler-version output to be non-empty"
            exit 1
          fi
          echo "PASS"
