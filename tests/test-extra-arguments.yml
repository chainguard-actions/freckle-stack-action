name: Test extra stack arguments and cache-prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/haskell-project
          test: true
          stack-build-arguments: "--fast"
          stack-build-arguments-dependencies: "--no-terminal"
          stack-build-arguments-build: "--no-terminal"
          stack-build-arguments-test: "--no-terminal"
          stack-query-arguments: ""
          stack-path-arguments: ""
          stack-setup-arguments: ""
          cache-prefix: "v1"
          install-stack: true
          upgrade-stack: false
          on-dirty-files: warn

      - name: Assert compiler output is set with extra arguments
        env:
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
        run: |
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          if [ -z "$COMPILER" ]; then
            echo "FAIL: expected compiler output to be set"
            exit 1
          fi
          if [ -z "$COMPILER_VERSION" ]; then
            echo "FAIL: expected compiler-version output to be set"
            exit 1
          fi
          echo "PASS: compiler=$COMPILER compiler-version=$COMPILER_VERSION"
