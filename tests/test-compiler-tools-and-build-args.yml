name: Test compiler tools and per-phase build arguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /nonexistent-path-that-does-not-exist
          test: "true"
          compiler-tools: |
            hlint
            weeder
          stack-build-arguments-dependencies: "--no-haddock"
          stack-build-arguments-test: "--coverage"
          install-stack: "false"
          upgrade-stack: "false"

      - name: Assert action ran with compiler tools and build args (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with compiler tools and per-phase build arguments"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without stack/GHC environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
