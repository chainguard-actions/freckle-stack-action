name: Test on-dirty-files error mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/haskell-project
          test: false
          stack-build-arguments: "--fast"
          on-dirty-files: error

      - name: Assert action ran with on-dirty-files error mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on whether stack is available
          # and whether any dirty files are detected. Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no dirty files detected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dirty files detected or toolchain unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
