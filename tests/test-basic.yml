name: Test - basic usage with example project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use the example directory which has a valid stack.yaml and Haskell source
          working-directory: "action/example"
          # Install stack if not present
          install-stack: "true"
          upgrade-stack: "false"
          # Skip tests to speed up the build
          test: "false"
          # Use a fast build
          stack-build-arguments: "--fast"
          on-dirty-files: "warn"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMPILER: ${{ steps.action.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.action.outputs.compiler-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "compiler: $COMPILER"
          echo "compiler-version: $COMPILER_VERSION"
          # The action should either succeed (full build) or fail gracefully
          # (e.g. network issues downloading GHC). It must NOT be skipped.
          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, verify that outputs were set
            if [ -z "$COMPILER" ]; then
              echo "FAIL: action succeeded but 'compiler' output is empty"
              exit 1
            fi
            if [ -z "$COMPILER_VERSION" ]; then
              echo "FAIL: action succeeded but 'compiler-version' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with compiler=$COMPILER version=$COMPILER_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/GHC download issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
